<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badar Amin | Portfolio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      margin-bottom: 1rem;
      background-color: var(--card);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: var(--accent);
      font-weight: 500;
      font-size: 1.05rem;
      margin-bottom: 1.25rem;
    }

    .bio {
      color: var(--muted);
      max-width: 650px;
      margin: 0 auto 1.5rem auto;
      text-align: center;
    }

    .contact-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .contact-links a {
      text-decoration: none;
      color: var(--text);
      background-color: var(--card);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: border-color 0.2s, color 0.2s;
    }

    .contact-links a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    section {
      margin-bottom: 2.5rem;
    }

    h2 {
      font-size: 1.35rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .skill-badge {
      background-color: var(--card);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
